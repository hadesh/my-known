name: KnowledgeVault
options:
  bundleIdPrefix: com.myknown
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  KnowledgeVaultCore:
    path: Packages/KnowledgeVaultCore

targets:
  KnowledgeVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KnowledgeVault-iOS
    resources:
      - path: KnowledgeVault-iOS/Resources
    dependencies:
      - package: KnowledgeVaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myknown.KnowledgeVault
        INFOPLIST_FILE: KnowledgeVault-iOS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: KnowledgeVault-iOS/Resources/Info.plist
      properties:
        CFBundleName: KnowledgeVault
        CFBundleDisplayName: MyKnown
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "拍摄照片以创建知识条目"
        NSMicrophoneUsageDescription: "录制语音笔记"
        NSPhotoLibraryUsageDescription: "从相册选取图片"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
